name: Build AlliedModders extension

on:
  workflow_call:
    inputs:
      sdks:
        description: "Space delimited list of SDKs to build against (e.g., css dods tf2)"
        required: true
        type: string
      artifact-path:
        description: "Artifact path to download from previous jobs"
        default: ""
        type: string
      submodules:
        description: "Whether to checkout submodules (true, false, or recursive)"
        default: "recursive"
        type: string
      mm-branch:
        description: "The MetaMod Repository branch to compile the extension against"
        default: "1.12-dev"
        type: string
      os-list:
        description: 'JSON array of OSes to build on, e.g. ["ubuntu-22.04"]'
        default: '["ubuntu-22.04", "windows-2022"]'
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
        sm-branch:
          - master
          - 1.12-dev

    name: ${{ matrix.os }} (SM ${{ matrix.sm-branch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}

      - name: Set compiler
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            echo "CC=msvc" >> "$GITHUB_ENV"
            echo "CXX=msvc" >> "$GITHUB_ENV"
          else
            echo "CC=clang-14" >> "$GITHUB_ENV"
            echo "CXX=clang++-14" >> "$GITHUB_ENV"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        if: inputs.artifact-path != ''
        with:
          path: ${{ inputs.artifact-path }}

      - name: Build extension
        uses: srcdslab/action-ambuild@v1
        id: ambuild
        with:
          os: ${{ matrix.os }}
          cc: ${{ env.CC }}
          cxx: ${{ env.CXX }}
          ambuild-ref: 'master'
          mm-ref: ${{ inputs.mm-branch }}
          sm-ref: ${{ matrix.sm-branch }}
          hl2sdk-manifests-ref: 'master'
          sdks: ${{ inputs.sdks }}
          configure-path: '../sm-ext-common/configure.py'
          configure-additional-flags: '--enable-optimize --enable-auto-versioning --ext-root "../"'

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-sm-${{ matrix.sm-branch }}
          path: ${{ steps.ambuild.outputs.package-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Github release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./gh-artifacts

      - name: Package artifacts
        shell: bash
        working-directory: gh-artifacts
        run: |
          for platform in *; do
            if [ -d "./$platform/" ]; then
              cd "./$platform/"
              tar -czf "../${{ github.event.repository.name }}-${platform,,}.tar.gz" -T <(ls -1)
              cd -
            fi
          done

      - name: Release packages
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: './gh-artifacts/*.tar.gz'
          tag: ${{ github.ref }}
          file_glob: true
